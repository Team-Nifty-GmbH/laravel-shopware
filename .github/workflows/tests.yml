name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    # The self-hosted runner executes as root with no HOME, and composer refuses
    # to start without one. It has nothing to do with the matrix; the workflow
    # simply has not run since the runner changed under it.
    env:
      COMPOSER_HOME: /tmp/composer-home

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Tests
        run: vendor/bin/pest
